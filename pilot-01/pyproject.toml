[build-system]
requires = ["setuptools>=78,<79"]
build-backend = "setuptools.build_meta"

[project]
name = "dacdm-pilot01"
version = "0.1.0"
description = "Research-integrity tooling for DACDM Pilot 01"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.4",
  "mypy==1.17.0",
]

[project.scripts]
dacdm = "dacdm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dacdm"]
