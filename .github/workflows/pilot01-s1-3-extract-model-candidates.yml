name: Extract S1.3 Model Candidates

on:
  push:
    branches:
      - s1-task-evidence-registries
    paths:
      - ".github/workflows/pilot01-s1-3-extract-model-candidates.yml"

permissions:
  contents: write

jobs:
  extract-candidates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pilot-01
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s1-task-evidence-registries
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pilot-01/requirements.lock
      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .
      - name: Extract candidates from frozen price snapshot
        run: |
          dacdm extract-s1-3-model-candidates \
            --ai-price-csv data/external/ai_price_index/82835a9bcf888b394483fc7b41ffc17c661608bf/ai_price_index.csv \
            --output registries/s1_3_model_candidates.json
          python - <<'PY'
          import json
          from pathlib import Path

          rows = json.loads(Path("registries/s1_3_model_candidates.json").read_text(encoding="utf-8"))
          assert rows
          providers = {str(row["provider"]).lower() for row in rows}
          assert providers <= {"openai", "anthropic"}
          assert {"openai", "anthropic"}.issubset(providers)
          assert all(row["launch_date_status"] == "UNVERIFIED" for row in rows)
          print(f"Verified S1.3 candidates: {len(rows)} models; providers={sorted(providers)}")
          PY
      - name: Run integrity and tests
        run: |
          dacdm validate-protocol
          dacdm validate-registries
          ruff check src tests
          mypy src
          pytest
      - name: Commit candidate snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registries/s1_3_model_candidates.json
          if git diff --cached --quiet; then
            echo "S1.3 model candidates already match frozen snapshot."
            exit 0
          fi
          git commit -m "Freeze S1.3 model candidates from pricing snapshot"
          git push origin HEAD:s1-task-evidence-registries
