name: Pilot 01 S1.5 Freeze Publication RC

on:
  push:
    branches:
      - s1-task-evidence-registries
    paths:
      - ".github/workflows/pilot01-s1-5-freeze-publication-rc.yml"
      - "pilot-01/scripts/freeze_s1_5_publication_rc.py"
      - "pilot-01/docs/S1.5-PUBLICATION-RELEASE-CANDIDATE-AND-ZENODO-METADATA-FREEZE.md"
      - "pilot-01/results/pilot01-preinference-termination-publication-rc1/**"
      - "pilot-01/publication-review/S1.4_REVIEW_STATUS.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout DACDM branch
        uses: actions/checkout@v4
        with:
          ref: s1-task-evidence-registries

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pilot-01/requirements.lock

      - name: Install locked dependencies and package
        working-directory: pilot-01
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: Integrity before S1.5 freeze
        working-directory: pilot-01
        run: |
          dacdm validate-protocol
          dacdm validate-registries
          ruff check src tests scripts/freeze_s1_5_publication_rc.py
          mypy src
          pytest

      - name: Build and validate S1.5 publication RC manifest
        working-directory: pilot-01
        run: python scripts/freeze_s1_5_publication_rc.py

      - name: Assert S1.5 release candidate boundaries
        working-directory: pilot-01
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("results/pilot01-preinference-termination-publication-rc1")
          manifest = json.loads((root / "PUBLICATION_MANIFEST.json").read_text())
          status = json.loads((root / "S1.5_FREEZE_STATUS.json").read_text())
          metadata = json.loads((root / "ZENODO_METADATA_RC1.json").read_text())
          report = (root / "DACDM_Pilot_01_PreInference_Termination_Report_RC1.md").read_text()

          assert status["status"] == "RC1_FROZEN_READY_FOR_ZENODO_DRAFT_DOI_RESERVATION"
          assert status["model_results_inspected"] is False
          assert status["paid_inference_performed"] is False
          assert status["reserved_doi"] is None
          assert status["zenodo_published"] is False
          assert status["final_pdf_docx_rendered"] is False

          guards = manifest["scientific_guards"]
          assert guards["scientific_result_changed"] is False
          assert guards["k4_threshold_changed"] is False
          assert guards["k4_arithmetic_changed"] is False
          assert guards["denominator_membership_changed"] is False
          assert guards["anchor_model_set_changed"] is False
          assert guards["model_results_inspected"] is False
          assert guards["paid_model_inference_run"] is False
          assert guards["zenodo_publication_performed"] is False
          assert len(manifest["payload_files"]) == 5

          assert metadata["publication_date"] is None
          assert metadata["reserved_doi"] is None
          assert metadata["zenodo_published"] is False
          assert metadata["creators"] == [{
              "family_name": "SAN",
              "given_names": "CHAU HUNG",
              "name_type": "personal",
          }]

          assert "did not explicitly define the K4 denominator" in report
          assert "frozen after S1.3.11 had already exposed pre-inference contamination sensitivity" in report
          assert "protocol mechanically classifies K4 as a falsification condition" in report
          assert "not a model-performance refutation of H2 or H4" in report
          PY

      - name: Freeze generated S1.5 manifest and status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pilot-01/results/pilot01-preinference-termination-publication-rc1/PUBLICATION_MANIFEST.json
          git add pilot-01/results/pilot01-preinference-termination-publication-rc1/S1.5_FREEZE_STATUS.json
          if git diff --cached --quiet; then
            echo "No S1.5 generated changes to commit"
            exit 0
          fi
          git commit -m "Freeze S1.5 Pilot 01 publication release candidate"
          git push origin HEAD:s1-task-evidence-registries

# S1.5 creates a publication candidate only.
# It does not reserve/publish a Zenodo DOI, render final DOI-bearing PDF/DOCX files,
# run paid model inference, or alter the frozen K4 result.
