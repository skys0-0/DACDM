name: Build Pilot 01 Task Registry Once

on:
  push:
    branches:
      - s1-task-evidence-registries
    paths:
      - ".github/workflows/pilot01-build-task-registry-once.yml"

permissions:
  contents: write

jobs:
  build-registry:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pilot-01
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s1-task-evidence-registries
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pilot-01/requirements.lock
      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .
      - name: Fetch pinned benchmark sources
        run: |
          mkdir -p .benchmark-sources/humaneval .benchmark-sources/mbpp
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/openai/human-eval/6d43fb980f9fee3c892a914eda09951f772ad10d/data/HumanEval.jsonl.gz" \
            --output .benchmark-sources/humaneval/HumanEval.jsonl.gz
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/google-research/google-research/5f07ba9ae246eeb20c5306fa13b865d2fd8496ad/mbpp/mbpp.jsonl" \
            --output .benchmark-sources/mbpp/mbpp.jsonl
      - name: Build and validate frozen task registry
        run: |
          dacdm build-task-registry --source-root .benchmark-sources
          dacdm validate-registries
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          rows = json.loads(Path("registries/tasks.json").read_text(encoding="utf-8"))
          counts = Counter(row["benchmark"] for row in rows)
          assert len(rows) == 1138, counts
          assert counts == {"humaneval": 164, "mbpp": 974}, counts
          assert len({row["task_id"] for row in rows}) == 1138
          assert all(str(row["content_hash"]).startswith("sha256:") for row in rows)
          print(f"Verified task registry: {dict(counts)}; total={len(rows)}")
          PY
      - name: Commit frozen task registry snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registries/tasks.json
          if git diff --cached --quiet; then
            echo "Task registry already matches pinned sources."
            exit 0
          fi
          git commit -m "Freeze S1.2 HumanEval and MBPP task registry"
          git push origin HEAD:s1-task-evidence-registries
