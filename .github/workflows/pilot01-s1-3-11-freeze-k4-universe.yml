name: Pilot 01 S1.3.11 Freeze K4 Universe

on:
  push:
    paths:
      - ".github/workflows/pilot01-s1-3-11-freeze-k4-universe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout DACDM branch
        uses: actions/checkout@v4
        with:
          ref: s1-task-evidence-registries

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pilot-01/requirements.lock

      - name: Install locked dependencies and package
        working-directory: pilot-01
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: Integrity before S1.3.11 freeze
        working-directory: pilot-01
        run: |
          dacdm validate-protocol
          dacdm validate-registries
          ruff check src tests
          mypy src
          pytest

      - name: Freeze K4 denominator and global task universe
        working-directory: pilot-01
        run: python scripts/freeze_s1_3_11.py

      - name: Assert S1.3.11 scientific boundary
        working-directory: pilot-01
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          summary = json.loads(Path("backtest/s1_3_11/summary.json").read_text())
          evaluation = json.loads(Path("backtest/s1_3_11/k4_evaluation.json").read_text())
          universe = json.loads(Path("backtest/s1_3_11/task_universe.json").read_text())

          assert summary["denominator_semantics"] == "PRE_CONTAMINATION_REGISTERED_TASK_UNIVERSE"
          assert summary["denominator_count"] == 1301
          assert summary["component_counts"] == {
              "humaneval": 164,
              "mbpp": 974,
              "leetcode_weekly_hard": 163,
          }
          assert len(universe["tasks"]) == 1301
          assert len({row["task_id"] for row in universe["tasks"]}) == 1301

          assert summary["enabled_test_window_model_count"] == 0
          assert summary["formal_k4_status"] == "K4_UNRESOLVED_MODEL_SET"
          assert evaluation["formal_k4_triggered"] is None
          assert evaluation["formal_excluded_fraction"] is None

          assert summary["current_evidence_model_count"] == 4
          assert summary["current_evidence_excluded_count"] == 1165
          assert summary["current_evidence_indeterminate_count"] == 4
          assert summary["current_evidence_eligible_count"] == 132
          assert math.isclose(
              summary["current_evidence_excluded_fraction"],
              1165 / 1301,
              rel_tol=0,
              abs_tol=1e-15,
          )
          assert math.isclose(
              summary["best_case_fraction_if_all_leetcode_candidates_were_clean"],
              1138 / 1301,
              rel_tol=0,
              abs_tol=1e-15,
          )
          assert summary["current_evidence_would_trigger_k4"] is True
          assert summary["k4_threshold"] == 0.3

          assert summary["model_results_inspected"] is False
          assert summary["paid_inference_permitted"] is False
          assert summary["next_gate"] == (
              "S1.3.12_TEST_WINDOW_MODEL_SET_FREEZE_AND_FINAL_PREINFERENCE_K4_EVALUATION"
          )
          PY

      - name: Freeze generated S1.3.11 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pilot-01/backtest/s1_3_11/task_universe.json \
            pilot-01/backtest/s1_3_11/k4_evaluation.json \
            pilot-01/backtest/s1_3_11/summary.json
          if git diff --cached --quiet; then
            echo "No S1.3.11 output changes to commit"
            exit 0
          fi
          git commit -m "Freeze S1.3.11 global task universe and K4 denominator"
          git push origin HEAD:s1-task-evidence-registries

# S1.3.11 freezes the K4 denominator interpretation before model outcomes.
# It does not enable any model, inspect model performance, or make paid API calls.
# The current four-model contamination calculation is sensitivity-only until S1.3.12
# freezes the actual test-window model set.
