name: Pilot 01 S1.3.6 Freeze Pre-Inference Audit

on:
  push:
    paths:
      - ".github/workflows/pilot01-s1-3-6-freeze-preinference-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s1-task-evidence-registries
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pilot-01/requirements.lock
      - name: Install locked dependencies and package
        working-directory: pilot-01
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .
      - name: Integrity before audit
        working-directory: pilot-01
        run: |
          dacdm validate-protocol
          dacdm validate-registries
          ruff check src tests
          mypy src
          pytest
      - name: Generate S1.3.6 audit
        working-directory: pilot-01
        run: dacdm audit-preinference-admissibility
      - name: Freeze generated audit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pilot-01/backtest/s1_3_6
          if git diff --cached --quiet; then
            echo "No S1.3.6 output changes to commit"
            exit 0
          fi
          git commit -m "Freeze S1.3.6 pre-inference admissibility audit"
          git push origin HEAD:s1-task-evidence-registries

# Exploratory calibration only. No paid model API calls are made.
