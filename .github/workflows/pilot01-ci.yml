name: Pilot 01 CI

on:
  push:
    paths:
      - "pilot-01/**"
      - "protocols/DACDM_Pilot_01_Protocol_v1.0.md"
      - ".github/workflows/pilot01-ci.yml"
  pull_request:
    paths:
      - "pilot-01/**"
      - "protocols/DACDM_Pilot_01_Protocol_v1.0.md"
      - ".github/workflows/pilot01-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pilot-01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pilot-01/requirements.lock
      - name: Install locked dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .
      - name: Protocol integrity
        run: dacdm validate-protocol
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src
      - name: Unit and fixture tests
        run: pytest

# Deliberately no paid model API calls in S0 CI.
